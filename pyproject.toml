[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-workflow-adapter"
version = "0.1.0"
description = "Production-grade, domain-neutral MCP workflow adapter with atomic idempotency, active asset locking, SQLite WAL local durability, and fenced AWS Step Functions reconciliation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Checkpoint Contributors" }]
keywords = ["mcp", "workflow", "idempotency", "step-functions", "dynamodb", "sqlite", "voice-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "starlette>=0.36.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "PyJWT[crypto]>=2.8.0,<3.0.0",
    "cryptography>=42.0.0,<45.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
]
dev = [
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "aws: live AWS integration tests requiring deployed CDK stack and valid AWS credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "BLE", "C4", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["src", "."]

[tool.pyright]
extraPaths = ["tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
